services:
  - type: web
    name: commitment-radar
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LYZR_API_KEY
        sync: false
      - key: LYZR_AGENT_ID
        sync: false
      - key: LYZR_API_BASE_URL
        sync: false
      - key: OMI_WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
