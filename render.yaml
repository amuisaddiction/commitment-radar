services:
  - type: web
    name: commitment-radar-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      # Configure these in the Render Dashboard:
      # - QDRANT_URL
      # - QDRANT_API_KEY
      # - LYZR_API_KEY
      # - LYZR_AGENT_ID
      # - QLOO_API_KEY
